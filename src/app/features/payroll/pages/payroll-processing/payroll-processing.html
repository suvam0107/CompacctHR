<div class="payroll-processing-page">
  <app-page-header
    title="Payroll Batch Processing"
    subtitle="Calculate salary batches, generate payslips, and approve monthly payroll runs"
  ></app-page-header>

  <div class="run-card">
    <div class="card-header">
      <div class="header-icon">
        <i class="pi pi-cog"></i>
      </div>
      <div>
        <h3 class="card-title">Run Monthly Payroll Batch</h3>
        <p class="card-desc">Select the billing cycle and department to execute stored procedure payroll calculation.</p>
      </div>
    </div>

    @if (isSuccess()) {
      <div class="success-banner">
        <i class="pi pi-check-circle"></i>
        <div>
          <span class="font-semibold">Payroll Batch Completed Successfully</span>
          <p class="text-sm m-0">All employee salary registers for the selected period have been processed.</p>
        </div>
      </div>
    }

    @if (errorMessage()) {
      <div class="error-banner">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="payrollForm" (ngSubmit)="onRunPayroll()" class="run-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="month">Salary Month *</label>
          <p-select id="month" [options]="months" optionLabel="label" optionValue="value" formControlName="month" styleClass="w-full"></p-select>
        </div>

        <div class="form-group">
          <label for="year">Salary Year *</label>
          <p-select id="year" [options]="years" optionLabel="label" optionValue="value" formControlName="year" styleClass="w-full"></p-select>
        </div>

        <div class="form-group">
          <label for="dept">Department Filter</label>
          <p-select id="dept" [options]="departmentOptions()" optionLabel="name" optionValue="id" [showClear]="true" placeholder="All Departments" formControlName="departmentId" styleClass="w-full"></p-select>
        </div>
      </div>

      <div class="form-footer">
        <p-button
          type="submit"
          label="Execute Payroll Run"
          icon="pi pi-play"
          [loading]="isProcessing()"
          size="small"
        ></p-button>
      </div>
    </form>
  </div>
</div>
