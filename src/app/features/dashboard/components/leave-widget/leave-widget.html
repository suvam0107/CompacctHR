<!-- src/app/features/dashboard/components/leave-widget/leave-widget.html -->
<div class="card leave-widget h-100 shadow-sm rounded">
  <div class="card-header d-flex align-items-center justify-content-between bg-transparent p-3 border-bottom">
    <div class="d-flex align-items-center gap-2">
      <i class="pi pi-calendar text-primary"></i>
      <h3 class="widget-title mb-0">Leave Balances</h3>
    </div>
    <a routerLink="/leave/history" class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1">
      <i class="pi pi-calendar-plus" style="font-size: 0.75rem;"></i>
      <span>Apply Leave</span>
    </a>
  </div>

  <div class="card-body p-3">
    @if (isLoading) {
      <app-loading-skeleton [rows]="3" height="40px"></app-loading-skeleton>
    } @else if (balances && balances.length > 0) {
      <div class="balances-list d-flex flex-column gap-3">
        @for (item of balances; track item.code) {
          <div class="balance-item p-2 rounded">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <div class="d-flex align-items-center gap-2">
                <span class="leave-code-badge">{{ item.code }}</span>
                <span class="leave-name fw-medium">{{ item.leaveType }}</span>
              </div>
              <div class="leave-count">
                <span class="fw-bold text-dark">{{ item.remaining }}</span>
                <span class="text-muted small"> / {{ item.total }} days</span>
              </div>
            </div>

            <!-- Mini Progress Bar -->
            <div class="leave-progress-track">
              <div
                class="leave-progress-fill"
                [style.width.%]="item.total > 0 ? (item.remaining / item.total) * 100 : 0"
              ></div>
            </div>
          </div>
        }
      </div>
    } @else {
      <div class="text-center py-4 text-muted">
        <p>No leave balances available.</p>
      </div>
    }
  </div>
</div>
