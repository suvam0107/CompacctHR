<div class="leave-apply-page">
  <app-page-header
    title="Apply for Leave"
    subtitle="Submit your time-off request and view available leave balances"
  >
    <div actions class="header-actions">
      <a routerLink="/leave/history">
        <p-button label="My Leave History" icon="pi pi-history" [outlined]="true" size="small"></p-button>
      </a>
    </div>
  </app-page-header>

  <!-- Leave Balances Row -->
  <div class="balances-row">
    @for (balance of leaveService.balances(); track balance.code) {
      <app-leave-balance-card [balance]="balance"></app-leave-balance-card>
    }
  </div>

  <!-- Leave Application Form Card -->
  <div class="form-card">
    <h3 class="form-title"><i class="pi pi-calendar-plus"></i> Leave Request Details</h3>

    @if (errorMessage()) {
      <div class="error-banner">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()" class="leave-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="leaveType">Leave Type *</label>
          <p-select
            id="leaveType"
            [options]="leaveTypeOptions()"
            optionLabel="name"
            optionValue="id"
            formControlName="leaveTypeId"
            styleClass="w-full"
          ></p-select>
        </div>

        <div class="form-group">
          <label for="fromDate">From Date *</label>
          <p-datepicker id="fromDate" formControlName="fromDate" [showIcon]="true" iconDisplay="input" dateFormat="dd M yy" styleClass="w-full"></p-datepicker>
        </div>

        <div class="form-group">
          <label for="toDate">To Date *</label>
          <p-datepicker id="toDate" formControlName="toDate" [showIcon]="true" iconDisplay="input" dateFormat="dd M yy" styleClass="w-full"></p-datepicker>
        </div>

        <div class="form-group">
          <label for="emergencyContact">Emergency Contact (Optional)</label>
          <input id="emergencyContact" type="text" pInputText formControlName="emergencyContact" placeholder="+91 98765 43210" class="w-full" />
        </div>

        <div class="form-group full-width">
          <label for="reason">Reason for Leave *</label>
          <input id="reason" type="text" pInputText formControlName="reason" placeholder="Please provide specific details..." class="w-full" />
          @if (leaveForm.get('reason')?.invalid && leaveForm.get('reason')?.touched) {
            <span class="error-text">Reason is required (min 5 characters)</span>
          }
        </div>
      </div>

      <div class="form-footer">
        <a routerLink="/leave/history">
          <p-button label="Cancel" [text]="true" severity="secondary" size="small"></p-button>
        </a>
        <p-button
          type="submit"
          label="Submit Application"
          icon="pi pi-send"
          [loading]="isSubmitting()"
          size="small"
        ></p-button>
      </div>
    </form>
  </div>
</div>
