<!-- src/app/features/leave/pages/leave-history/leave-history.html -->
<div class="leave-history-page">
  <app-page-header title="My Leave History"></app-page-header>

  <app-data-table
    [columns]="columns"
    [value]="leaveService.history()"
    [loading]="leaveService.isLoading()"
    exportFilename="compacct_my_leave_history"
    title="My Leave History"
  >
    <!-- Right Table Header Action Button -->
    <ng-template #headerActions>
      <p-button
        label="Apply Leave"
        icon="pi pi-plus"
        (onClick)="openApplyModal()"
      ></p-button>
    </ng-template>
  </app-data-table>

  <!-- Apply Leave Modal Dialog -->
  <p-dialog
    header="Apply for Leave"
    [visible]="showApplyDialog()"
    (visibleChange)="showApplyDialog.set($event)"
    [modal]="true"
    [style]="{ width: 'min(660px, 95vw)' }"
    [draggable]="false"
    [resizable]="false"
  >
    @if (errorMessage()) {
      <div class="status-banner status-banner--error mb-3">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="leaveForm" (ngSubmit)="onSubmitLeave()" class="dialog-form-body" novalidate>
      <div class="row g-3">
        <!-- Leave Type -->
        <div class="col-12">
          <div class="ff">
            <label for="leaveType" class="ff-label">Leave Type <span class="required-mark">*</span></label>
            <p-select id="leaveType" [options]="leaveTypeOptions()" optionLabel="name" optionValue="id"
              formControlName="leaveTypeId" appendTo="body" styleClass="w-full"></p-select>
          </div>
        </div>

        <!-- From Date -->
        <div class="col-12 col-sm-6">
          <div class="ff">
            <label for="fromDate" class="ff-label">From Date <span class="required-mark">*</span></label>
            <p-datepicker id="fromDate" formControlName="fromDate" [showIcon]="true" iconDisplay="input"
              dateFormat="dd M yy" appendTo="body" styleClass="w-full"></p-datepicker>
          </div>
        </div>

        <!-- To Date -->
        <div class="col-12 col-sm-6">
          <div class="ff">
            <label for="toDate" class="ff-label">To Date <span class="required-mark">*</span></label>
            <p-datepicker id="toDate" formControlName="toDate" [showIcon]="true" iconDisplay="input"
              dateFormat="dd M yy" appendTo="body" styleClass="w-full"></p-datepicker>
          </div>
        </div>

        <!-- Reason -->
        <div class="col-12">
          <div class="ff">
            <label for="reason" class="ff-label">Reason for Leave <span class="required-mark">*</span></label>
            <input id="reason" type="text" pInputText formControlName="reason"
              placeholder="e.g. Family medical emergency" class="w-full" />
            @if (leaveForm.get('reason')?.invalid && leaveForm.get('reason')?.touched) {
              <div class="ff-error"><i class="pi pi-exclamation-triangle"></i> Reason is required (minimum 5 characters)</div>
            }
          </div>
        </div>

        <!-- Emergency Contact -->
        <div class="col-12">
          <div class="ff">
            <label for="emergencyContact" class="ff-label">Emergency Contact <span class="optional-mark">(Optional)</span></label>
            <input id="emergencyContact" type="text" pInputText formControlName="emergencyContact"
              placeholder="e.g. 9876543210" class="w-full" />
          </div>
        </div>
      </div>

      <div class="dialog-footer-actions">
        <p-button label="Cancel" [text]="true" severity="secondary" (onClick)="showApplyDialog.set(false)"></p-button>
        <p-button type="submit" label="Submit Application" icon="pi pi-send" [loading]="isSubmitting()"></p-button>
      </div>
    </form>
  </p-dialog>
</div>
