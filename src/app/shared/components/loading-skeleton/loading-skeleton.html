<!-- src/app/shared/components/loading-skeleton/loading-skeleton.html -->
<div class="skeleton-container" [class]="'skeleton-' + type">
  @if (type === 'card') {
    <div class="skeleton-card p-4 rounded mb-3">
      <div class="skeleton-shimmer skeleton-title mb-3" style="width: 40%; height: 24px;"></div>
      <div class="skeleton-shimmer skeleton-line mb-2" style="width: 80%; height: 16px;"></div>
      <div class="skeleton-shimmer skeleton-line" style="width: 60%; height: 16px;"></div>
    </div>
  } @else if (type === 'table') {
    <div class="skeleton-table">
      <div class="skeleton-shimmer skeleton-header mb-3" style="width: 100%; height: 36px;"></div>
      @for (row of rowArray; track row) {
        <div class="skeleton-shimmer skeleton-row mb-2" [style.height]="height" style="width: 100%;"></div>
      }
    </div>
  } @else {
    @for (row of rowArray; track row) {
      <div
        class="skeleton-shimmer skeleton-line mb-2"
        [style.height]="height"
        [style.width]="row === rowArray.length - 1 ? '70%' : '100%'"
      ></div>
    }
  }
</div>
