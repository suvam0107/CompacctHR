<div class="date-range-container">
  @if (showPresets) {
    <p-select
      [options]="presets"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="selectedPreset"
      (ngModelChange)="onPresetChange($event)"
      placeholder="Preset"
      appendTo="body"
      styleClass="preset-select"
    ></p-select>
  }

  <p-datepicker
    [(ngModel)]="dates"
    (ngModelChange)="onDateSelect()"
    selectionMode="range"
    [readonlyInput]="true"
    [showIcon]="true"
    iconDisplay="input"
    [dateFormat]="dateFormat"
    [placeholder]="placeholder"
    appendTo="body"
    (onSelect)="onDateSelect()"
    styleClass="custom-datepicker"
  ></p-datepicker>
</div>
