<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCE9F8" />
      <stop offset="100%" stop-color="#EAF2FB" />
    </linearGradient>
  </defs>

  <!-- Background decorative grid / circles -->
  <circle cx="250" cy="200" r="180" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="250" cy="200" r="130" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
  <circle cx="250" cy="200" r="70" fill="#ffffff" fill-opacity="0.06" />

  <!-- Center Floating ERP Hub Card -->
  <rect x="150" y="110" width="200" height="180" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.12))" />

  <!-- Card Header Bars -->
  <rect x="175" y="135" width="70" height="12" rx="6" fill="#ffffff" fill-opacity="0.9" />
  <rect x="175" y="155" width="150" height="6" rx="3" fill="#ffffff" fill-opacity="0.4" />
  <rect x="175" y="167" width="120" height="6" rx="3" fill="#ffffff" fill-opacity="0.3" />

  <!-- Card Mini Metrics -->
  <rect x="175" y="190" width="42" height="42" rx="8" fill="#ffffff" fill-opacity="0.15" />
  <circle cx="196" cy="206" r="6" fill="#DCE9F8" />
  <rect x="186" y="218" width="20" height="4" rx="2" fill="#DCE9F8" />

  <rect x="229" y="190" width="42" height="42" rx="8" fill="#ffffff" fill-opacity="0.15" />
  <path d="M245 204 L250 209 L256 201" stroke="#1E8E5A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="240" y="218" width="20" height="4" rx="2" fill="#DCE9F8" />

  <rect x="283" y="190" width="42" height="42" rx="8" fill="#ffffff" fill-opacity="0.15" />
  <circle cx="304" cy="211" r="9" stroke="#B7791F" stroke-width="2" />
  <path d="M304 206 V211 H308" stroke="#B7791F" stroke-width="1.5" stroke-linecap="round" />

  <rect x="175" y="248" width="150" height="24" rx="6" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="190" cy="260" r="4" fill="#EAF2FB" />
  <rect x="202" y="257" width="80" height="6" rx="3" fill="#ffffff" fill-opacity="0.8" />

  <!-- Satellite Badge 1: Employees / Users -->
  <g transform="translate(60, 80)">
    <rect width="120" height="48" rx="12" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="26" cy="24" r="12" fill="#DCE9F8" />
    <circle cx="26" cy="21" r="5" fill="#14539A" />
    <path d="M19 30 C19 26 33 26 33 30" fill="#14539A" />
    <rect x="46" y="17" width="55" height="6" rx="3" fill="#ffffff" />
    <rect x="46" y="27" width="38" height="4" rx="2" fill="#ffffff" fill-opacity="0.6" />
  </g>

  <!-- Satellite Badge 2: Attendance & Clock -->
  <g transform="translate(320, 70)">
    <rect width="120" height="48" rx="12" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="26" cy="24" r="12" fill="#1E8E5A" fill-opacity="0.25" />
    <circle cx="26" cy="24" r="7" stroke="#1E8E5A" stroke-width="1.5" fill="none" />
    <path d="M26 20 V24 H29" stroke="#1E8E5A" stroke-width="1.5" stroke-linecap="round" />
    <rect x="46" y="17" width="58" height="6" rx="3" fill="#ffffff" />
    <rect x="46" y="27" width="42" height="4" rx="2" fill="#ffffff" fill-opacity="0.6" />
  </g>

  <!-- Satellite Badge 3: Payroll & Security -->
  <g transform="translate(330, 270)">
    <rect width="115" height="48" rx="12" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="26" cy="24" r="12" fill="#DCE9F8" />
    <path d="M26 16 L31 18 V23 C31 26 26 29 26 29 C26 29 21 26 21 23 V18 L26 16 Z" fill="#14539A" />
    <rect x="46" y="17" width="50" height="6" rx="3" fill="#ffffff" />
    <rect x="46" y="27" width="35" height="4" rx="2" fill="#ffffff" fill-opacity="0.6" />
  </g>

  <!-- Satellite Badge 4: Verified Leave -->
  <g transform="translate(70, 270)">
    <rect width="115" height="48" rx="12" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="26" cy="24" r="12" fill="#1E8E5A" fill-opacity="0.2" />
    <path d="M21 24 L24 27 L31 20" stroke="#1E8E5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="46" y="17" width="50" height="6" rx="3" fill="#ffffff" />
    <rect x="46" y="27" width="36" height="4" rx="2" fill="#ffffff" fill-opacity="0.6" />
  </g>
</svg>
